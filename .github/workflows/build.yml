name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: actions/checkout@v7

      # Name the download after the mod and its version, e.g. "Click-Indicator-v1.2.2"
      - name: Read mod name and version
        run: |
          NAME=$(jq -r '.name' mod.json | tr ' ' '-')
          VERSION=$(jq -r '.version' mod.json)
          echo "ARTIFACT_NAME=${NAME}-${VERSION}" >> "$GITHUB_ENV"

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.build.outputs.build-output }}
